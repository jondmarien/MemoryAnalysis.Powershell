name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  POWERSHELL_VERSION: '7.7.0-preview.2'

# Three independent platform pipelines run in parallel. Each pipeline is
# sequential: Rust → C# → Build → Integration. Ubuntu/macOS no longer wait for
# Windows to finish Rust/C# before starting their own build step.
jobs:
  ci-windows:
    name: CI (Windows)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: windows-latest

  ci-ubuntu:
    name: CI (Ubuntu)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: ubuntu-latest

  ci-macos:
    name: CI (macOS)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: macos-latest

  benchmark:
    name: Performance Benchmarks
    runs-on: windows-latest
    needs: ci-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install PowerShell 7.7 Preview
        shell: pwsh
        run: |
          $version = '${{ env.POWERSHELL_VERSION }}'
          $zip = "PowerShell-$version-win-x64.zip"
          $url = "https://github.com/PowerShell/PowerShell/releases/download/v$version/$zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\pwsh-preview" -Force
          $pwsh = Get-ChildItem -Path "$env:RUNNER_TEMP\pwsh-preview" -Recurse -Filter pwsh.exe | Select-Object -First 1
          echo "PWSH_PREVIEW=$($pwsh.FullName)" >> $env:GITHUB_ENV

      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: MemoryAnalysis-windows-latest
          path: PowerShell.MemoryAnalysis/publish/

      - name: Run Benchmarks
        shell: pwsh
        run: |
          & $env:PWSH_PREVIEW -Command {
            Set-Location "$env:GITHUB_WORKSPACE"
            ./benchmarks/Measure-Performance.ps1
          }

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: benchmarks/benchmark-results-*.json
          retention-days: 30
