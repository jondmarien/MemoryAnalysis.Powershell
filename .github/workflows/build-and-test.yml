name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  POWERSHELL_VERSION: '7.7.0-preview.2'

# Three independent platform pipelines run in parallel. Each pipeline is
# sequential: Rust → C# → Build → Integration. Ubuntu/macOS no longer wait for
# Windows to finish Rust/C# before starting their own build step.
jobs:
  ci-windows:
    name: CI (Windows)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: windows-2025-vs2026

  ci-ubuntu:
    name: CI (Ubuntu)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: ubuntu-latest

  ci-macos:
    name: CI (macOS)
    uses: ./.github/workflows/platform-pipeline.yml
    with:
      runner: macos-latest

  benchmark-windows:
    name: Performance Benchmarks (Windows)
    needs: ci-windows
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/benchmark.yml
    with:
      runner: windows-2025-vs2026

  benchmark-ubuntu:
    name: Performance Benchmarks (Ubuntu)
    needs: ci-ubuntu
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/benchmark.yml
    with:
      runner: ubuntu-latest

  benchmark-macos:
    name: Performance Benchmarks (macOS)
    needs: ci-macos
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/benchmark.yml
    with:
      runner: macos-latest
